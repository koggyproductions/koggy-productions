<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koggy Productions LLP</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory;
    }
    body {
      min-height: 100vh;
      background: #060709 radial-gradient(circle at 50% 50%, #171d28 0%, #060709 85%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      text-align: center;
      user-select: none;
      overflow-x: hidden;
      position: relative;
    }

    #shake-container {
      width: 100%;
      position: relative;
      z-index: 2;
    }

    /* Camera Juice Screen Shake */
    @keyframes cameraJuice {
      0% { transform: translate(0, 0) rotate(0deg); }
      15% { transform: translate(-10px, 6px) rotate(-1deg); }
      30% { transform: translate(9px, -6px) rotate(0.8deg); }
      45% { transform: translate(-6px, -4px) rotate(-0.5deg); }
      60% { transform: translate(6px, 4px) rotate(0.4deg); }
      75% { transform: translate(-3px, 2px) rotate(-0.2deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
    .shake-active {
      animation: cameraJuice 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    /* Hot Shower Steam Canvas */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    /* Soft Denim Weave + Sharp Checker Grid Layer (Visible across both pages) */
    .denim-grid-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.12) 1px, transparent 1px),
        repeating-linear-gradient(
          45deg,
          rgba(255, 255, 255, 0.03) 0px,
          rgba(255, 255, 255, 0.03) 1px,
          transparent 1px,
          transparent 4px
        ),
        repeating-linear-gradient(
          -45deg,
          rgba(0, 0, 0, 0.35) 0px,
          rgba(0, 0, 0, 0.35) 1px,
          transparent 1px,
          transparent 4px
        );
      background-size: 38px 38px, 38px 38px, 4px 4px, 4px 4px;
    }

    /* Two-Page Presentation Structure */
    .page-section {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      scroll-snap-align: start;
      position: relative;
      z-index: 2;
      padding: 75px 16px 45px; /* top padding clears the fixed top bar */
      background: transparent;
    }

    header.studio-intro {
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .badge {
      display: inline-block;
      background: #000000;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 7px 22px;
      border: 1.5px solid #ffffff;
      margin-bottom: 16px;
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.3), box-shadow 0.2s ease, border-color 0.2s ease;
      will-change: transform;
    }
    .badge:hover {
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.85);
      border-color: #ffffff;
    }
    h1 {
      font-size: clamp(1.75rem, 4.3vw, 3.3rem);
      font-weight: 900;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      margin-bottom: 14px;
      display: inline-flex;
      flex-wrap: nowrap; /* STRICTLY SINGLE LINE - NEVER WRAP */
      white-space: nowrap;
      justify-content: center;
      align-items: center;
      line-height: 1.1;
      max-width: 96vw;
    }
    .char-span {
      display: inline-block;
      transition: transform 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.3), color 0.15s ease, text-shadow 0.18s ease;
      cursor: pointer;
    }
    .char-span:hover {
      transform: translateY(-10px) scale(1.22) rotate(-3deg);
      color: #ffffff;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.95), 0 0 30px rgba(255, 255, 255, 0.6);
    }
    .char-space {
      display: inline-block;
      width: 0.35em;
    }
    .duo-tag {
      display: inline-block;
      color: #ffffff;
      font-size: 1.15rem;
      border-left: 3px solid #ffffff;
      padding-left: 16px;
      margin-bottom: 28px;
      text-align: left;
      line-height: 1.45;
    }

    /* Enter Arcade Button & Prompt */
    .enter-arcade-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 12px 28px;
      background: #000000;
      color: #ffffff;
      border: 2px solid #ffffff;
      font-family: monospace;
      font-weight: 900;
      font-size: 1rem;
      letter-spacing: 2px;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: 4px 4px 0px #ffffff;
      transition: all 0.15s ease;
      cursor: pointer;
    }
    .enter-arcade-btn:hover {
      background: #ffffff;
      color: #000000;
      box-shadow: 2px 2px 0px #888888;
      transform: translate(2px, 2px);
    }
    .bounce-arrow {
      margin-top: 14px;
      font-size: 1.1rem;
      color: #888888;
      animation: floatArrow 1.5s ease-in-out infinite;
    }
    @keyframes floatArrow {
      0%, 100% { transform: translateY(0); opacity: 0.4; }
      50% { transform: translateY(6px); opacity: 1; }
    }
    .back-top-btn {
      display: inline-block;
      margin-top: 14px;
      color: #666666;
      font-family: monospace;
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-decoration: none;
      transition: color 0.15s;
    }
    .back-top-btn:hover {
      color: #ffffff;
    }

    /* Main Arcade Game Frame (Wider screen presentation) */
    #game-container {
      position: relative;
      width: 95vw;
      max-width: 660px;
      aspect-ratio: 540 / 360;
      height: auto;
      max-height: calc(100vh - 180px);
      background: #000000;
      border: 2px solid #ffffff;
      box-shadow: 10px 10px 0px #ffffff;
      overflow: hidden;
      cursor: crosshair;
    }
    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    .status {
      margin-top: 16px;
      font-size: 0.82rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #777777;
    }

    /* Fixed Navigation Bar (Pinned at top across all pages) */
    .fixed-top-bar, footer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: auto;
      width: 100%;
      padding: 10px 24px;
      background: rgba(6, 7, 9, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      border-top: none;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.82rem;
      color: #888888;
      z-index: 1000;
    }
    .top-bar-inner, .footer-inner {
      width: 100%;
      max-width: 860px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .top-bar-links, .footer-links {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .social-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #000000;
      color: #d1d5db;
      border: 1px solid #444444;
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 0.78rem;
      font-family: monospace;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      letter-spacing: 0.5px;
    }
    .social-pill:hover {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }
    .social-pill svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }
    .duck-trigger-btn {
      background: #000000;
      color: #ffffff;
      border: 1px solid #555555;
      padding: 4px 10px;
      font-family: monospace;
      font-size: 0.8rem;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.15s;
    }
    .duck-trigger-btn:hover {
      border-color: #ffffff;
      background: #ffffff;
      color: #000000;
    }
    .tc-link {
      color: #ffffff;
      text-decoration: none;
      border-bottom: 1px solid #ffffff;
      font-size: 0.85rem;
    }
    .tc-link:hover {
      background: #ffffff;
      color: #000000;
    }

    #duck-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>

  <div id="shake-container">
    <!-- PAGE 1: Studio Introduction (Centered Full Screen) -->
    <section id="hero-section" class="page-section">
      <header class="studio-intro">
        <div class="badge" id="studio-badge">Indie Game Studio</div>
        <h1 aria-label="KOGGY PRODUCTIONS LLP">
          <span class="char-span">K</span><span class="char-span">O</span><span class="char-span">G</span><span class="char-span">G</span><span class="char-span">Y</span><span class="char-space">&nbsp;</span><span class="char-span">P</span><span class="char-span">R</span><span class="char-span">O</span><span class="char-span">D</span><span class="char-span">U</span><span class="char-span">C</span><span class="char-span">T</span><span class="char-span">I</span><span class="char-span">O</span><span class="char-span">N</span><span class="char-span">S</span><span class="char-space">&nbsp;</span><span class="char-span">L</span><span class="char-span">L</span><span class="char-span">P</span>

  <!-- PAGE 2: Koggy Arcade Block (Full Screen) -->
  <section id="arcade-section" class="page-section">
    <div id="game-container">
      <canvas id="gameCanvas" width="540" height="360"></canvas>
    </div>

    <div class="status">
      [ Status: In Development • koggyproductions.org ]
    </div>

    <a href="#hero-section" class="back-top-btn">▲ BACK TO TOP ▲</a>

  <script>
    /* ====================================================
       1. STEAM EFFECT
       ==================================================== */
    const bgCanvas = document.getElementById("bg-canvas");
    const bgCtx = bgCanvas.getContext("2d");
    let steamPuffs = [];
    const STEAM_COUNT = 45;

    function resizeBg() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeBg);
    resizeBg();

    for (let i = 0; i < STEAM_COUNT; i++) {
      steamPuffs.push({
        x: Math.random() * bgCanvas.width,
        y: Math.random() * bgCanvas.height,
        radius: 90 + Math.random() * 150,
        vx: (Math.random() - 0.5) * 0.7,
        vy: -1.2 - Math.random() * 1.6,
        alpha: 0.05 + Math.random() * 0.07,
        growRate: 0.2 + Math.random() * 0.3
      });
    }

    function renderSteam() {
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      steamPuffs.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.radius += p.growRate;
        if (p.y < -p.radius || p.radius > 280) {
          p.y = bgCanvas.height + 40;
          p.x = Math.random() * bgCanvas.width;
          p.radius = 80 + Math.random() * 80;
        }
        const grad = bgCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
        grad.addColorStop(0, `rgba(255, 255, 255, ${p.alpha * 1.2})`);
        grad.addColorStop(0.5, `rgba(255, 255, 255, ${p.alpha * 0.6})`);
        grad.addColorStop(1, "rgba(255, 255, 255, 0)");
        bgCtx.fillStyle = grad;
        bgCtx.beginPath();
        bgCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        bgCtx.fill();
      });
      requestAnimationFrame(renderSteam);
    }
    renderSteam();

    /* ====================================================
       2. DUCKS + SCREEN JUICE
       ==================================================== */
    const duckCanvas = document.getElementById("duck-canvas");
    const duckCtx = duckCanvas.getContext("2d");
    let activeDucks = [];

    function resizeDuckCanvas() {
      duckCanvas.width = window.innerWidth;
      duckCanvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeDuckCanvas);
    resizeDuckCanvas();

    function triggerCameraJuice() {
      const el = document.getElementById("shake-container") || document.body;
      el.classList.remove("shake-active");
      void el.offsetWidth;
      el.classList.add("shake-active");
    }

    function drawDuck(ctx, x, y, scale, rotation = 0) {
      ctx.save();
      ctx.translate(x, y);
      if (rotation !== 0) ctx.rotate(rotation);
      ctx.scale(scale, scale);
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 2.5;

      ctx.beginPath();
      ctx.ellipse(0, 4, 18, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(-2, 4, 7, 0.2, Math.PI - 0.2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(10, -8, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#000000";
      ctx.beginPath();
      ctx.arc(12, -9, 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.moveTo(18, -9);
      ctx.lineTo(26, -6);
      ctx.lineTo(18, -3);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function triggerDuckStampede() {
      triggerCameraJuice();
      playQuackSound();
      const isPage2 = (window.scrollY > window.innerHeight * 0.4);

      if (isPage2) {
        // Page 2: Ducks fall from top of screen down across the arcade!
        for (let i = 0; i < 45; i++) {
          activeDucks.push({
            mode: "FALL",
            x: 20 + Math.random() * (duckCanvas.width - 40),
            baseX: 20 + Math.random() * (duckCanvas.width - 40),
            y: -60 - Math.random() * 450,
            vy: 6 + Math.random() * 6.5,
            scale: 0.85 + Math.random() * 0.5,
            waddleAngle: Math.random() * Math.PI * 2,
            waddleSpeed: 0.14 + Math.random() * 0.12,
            rotation: 0.25 + (Math.random() - 0.5) * 0.3
          });
        }
      } else {
        // Page 1: Horizontal stampede across screen!
        for (let i = 0; i < 45; i++) {
          activeDucks.push({
            mode: "RUN",
            x: -60 - Math.random() * 500,
            y: 40 + Math.random() * (duckCanvas.height - 80),
            baseY: 40 + Math.random() * (duckCanvas.height - 80),
            vx: 5 + Math.random() * 6,
            scale: 0.85 + Math.random() * 0.5,
            waddleAngle: Math.random() * Math.PI * 2,
            waddleSpeed: 0.16 + Math.random() * 0.12,
            rotation: 0
          });
        }
      }
    }

    function updateDucks() {
      duckCtx.clearRect(0, 0, duckCanvas.width, duckCanvas.height);
      for (let i = activeDucks.length - 1; i >= 0; i--) {
        const d = activeDucks[i];
        d.waddleAngle += d.waddleSpeed;

        if (d.mode === "FALL") {
          d.y += d.vy;
          d.x = d.baseX + Math.sin(d.waddleAngle) * 12;
          d.rotation = Math.sin(d.waddleAngle) * 0.2 + 0.35; // tilted down fluttering
          drawDuck(duckCtx, d.x, d.y, d.scale, d.rotation);
          if (d.y > duckCanvas.height + 80) activeDucks.splice(i, 1);
        } else {
          d.x += d.vx;
          d.y = d.baseY + Math.sin(d.waddleAngle) * 8;
          drawDuck(duckCtx, d.x, d.y, d.scale, 0);
          if (d.x > duckCanvas.width + 60) activeDucks.splice(i, 1);
        }
      }
      requestAnimationFrame(updateDucks);
    }
    updateDucks();


    /* ====================================================
       PROCEDURAL WEB AUDIO SYNTHESIZER (Generated SFX)
       ==================================================== */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let sfxEnabled = true;

    function ensureAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    // 1. Synthesized Quack Sound!
    function playQuackSound() {
      if (!sfxEnabled) return;
      ensureAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        // Frequency sweep mimicking duck quack
        osc.frequency.setValueAtTime(420, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(170, audioCtx.currentTime + 0.16);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.16);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.16);
      } catch(e) {}
    }

    // 2. Giant Duck Boss Horn Siren
    function playBossWarningSound() {
      if (!sfxEnabled) return;
      ensureAudio();

    // 13. Aircraft Jet Engine Sound Synthesizer (Continuous Thruster Loop)
    let engineOsc = null;
    let engineSubOsc = null;
    let engineGain = null;
    let engineFilter = null;
    let engineRunning = false;

    function startAircraftEngine() {
      if (!sfxEnabled || engineRunning) return;
      ensureAudio();
      try {
        engineGain = audioCtx.createGain();
        engineGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        engineGain.gain.exponentialRampToValueAtTime(0.065, audioCtx.currentTime + 0.25);

        // Lowpass filter creates an authentic deep jet turbine rumble
        engineFilter = audioCtx.createBiquadFilter();
        engineFilter.type = "lowpass";
        engineFilter.frequency.setValueAtTime(230, audioCtx.currentTime);

        // Primary jet turbine hum (sawtooth through lowpass gives that classic jet drone)
        engineOsc = audioCtx.createOscillator();
        engineOsc.type = "sawtooth";
        engineOsc.frequency.setValueAtTime(78, audioCtx.currentTime);

        // Secondary sub-harmonic for twin-jet depth (@v11ddx & @dhd.exe formation)
        engineSubOsc = audioCtx.createOscillator();
        engineSubOsc.type = "triangle";
        engineSubOsc.frequency.setValueAtTime(118, audioCtx.currentTime);

        engineOsc.connect(engineFilter);
        engineSubOsc.connect(engineFilter);
        engineFilter.connect(engineGain);
        engineGain.connect(audioCtx.destination);

        engineOsc.start();
        engineSubOsc.start();
        engineRunning = true;
      } catch(e) {}
    }

    function updateAircraftEngine(roll = 0) {
      if (!engineRunning || !engineOsc || !sfxEnabled || !audioCtx) return;
      try {
        // Thrusters spool up slightly when banking into turns!
        const pitchBend = Math.abs(roll) * 32;
        engineOsc.frequency.setTargetAtTime(78 + pitchBend, audioCtx.currentTime, 0.05);
        if (engineSubOsc) {
          engineSubOsc.frequency.setTargetAtTime(118 + pitchBend * 1.2, audioCtx.currentTime, 0.05);
        }
      } catch(e) {}
    }

    function stopAircraftEngine() {
      if (!engineRunning) return;
      try {
        if (engineGain && audioCtx) {
          engineGain.gain.setValueAtTime(engineGain.gain.value, audioCtx.currentTime);
          engineGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
        }
        const o1 = engineOsc;
        const o2 = engineSubOsc;
        engineOsc = null;
        engineSubOsc = null;
        engineRunning = false;
        setTimeout(() => {
          try { if (o1) { o1.stop(); o1.disconnect(); } } catch(e){}
          try { if (o2) { o2.stop(); o2.disconnect(); } } catch(e){}
        }, 120);
      } catch(e) {
        engineRunning = false;
      }
    }

    let lastScrollZooshTime = 0;

    const SCROLL_ZOOSH_COOLDOWN = 1000; // 1-second cooldown per user request

    function playScrollZoosh(isDown = true, duration = 0.16) {
      if (!sfxEnabled) return;
      ensureAudio();
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        
        // Soft air whoosh oscillator (smooth triangle through warm lowpass filter)
        const osc = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();

        osc.type = "triangle";
        filter.type = "lowpass";

        if (isDown) {
          // Downward soft air zoosh
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(105, now + duration);
          filter.frequency.setValueAtTime(420, now);
          filter.frequency.exponentialRampToValueAtTime(150, now + duration);
        } else {
          // Upward soft air zoosh
          osc.frequency.setValueAtTime(120, now);
          osc.frequency.exponentialRampToValueAtTime(300, now + duration);
          filter.frequency.setValueAtTime(160, now);
          filter.frequency.exponentialRampToValueAtTime(420, now + duration);
        }

        // Very small, subtle soft volume
        gain.gain.setValueAtTime(0.035, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + duration);
      } catch(e) {}
    }

    /* ====================================================
       3. 3-IN-1 ARCADE SYSTEM (Global Any-Key Retry & Tuned Gameplay)
       ==================================================== */
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const WIDTH = 540;
    const HEIGHT = 360;

    let activeGame = "MENU"; // "MENU", "LOVERS", "AIRCRAFT", "MONSTER"
    let gameDifficulty = "medium"; // "easy", "medium", "hard"
    let keys = {};
    let mousePos = { x: WIDTH / 2, y: HEIGHT / 2 };

    // GLOBAL ANY-KEY PRESS LISTENER (Restarts ANY game on gameover/victory)
    window.addEventListener("keydown", (e) => {
      keys[e.key] = true;
      if (e.key === "Escape") {
        activeGame = "MENU";
        stopAircraftEngine();
        return;
      }

      // Game 1: Lovers Meet Movement & Replay
      if (activeGame === "LOVERS") {
        if (loversState === "GAMEOVER") {
          initLoversLevel(loversLevel);
          return;
        }
        if (loversState === "REUNITED") {
          nextLoversLevel();
          return;
        }
        if (loversState === "PLAYING") {
          if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") { moveLoversPlayer(0, -1); e.preventDefault(); }
          else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") { moveLoversPlayer(0, 1); e.preventDefault(); }
          else if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { moveLoversPlayer(-1, 0); e.preventDefault(); }
          else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { moveLoversPlayer(1, 0); e.preventDefault(); }
        }
      }

      // Game 2 Replay on ANY KEY or Shoot on SPACE
      if (activeGame === "AIRCRAFT") {
        if (airState === "GAMEOVER") {
          initAircraft();
          startAircraftEngine();
          return;
        } else if (airState === "PLAYING" && (e.code === "Space" || e.key === "Enter")) {
          fireAircraftWeapons();
        }
      }

      // Game 3 Replay on ANY KEY (when dead or rematch ready)
      if (activeGame === "MONSTER") {
        if (monsterState === "GAMEOVER") {
          initMonster();
          return;
        }
        if (monsterState === "VICTORY" && rematchReady) {
          initMonster();
          return;
        }

        // Jump keys: Space, Up Arrow, or W
        if (e.code === "Space" || e.key === "ArrowUp" || e.key === "w" || e.key === "W") {
          monsterPlayerJump();
        }
        // Dash key: Shift
        if (e.key === "Shift") {
          monsterPlayerDash();
        }
      }
    });

    window.addEventListener("keyup", (e) => { keys[e.key] = false; });

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (WIDTH / rect.width),
        y: (e.clientY - rect.top) * (HEIGHT / rect.height)
      };
    }

    canvas.addEventListener("mousemove", (e) => {
      mousePos = getCoords(e);
      if (activeGame === "AIRCRAFT") updateAircraftMouse(mousePos.x);
      if (activeGame === "MONSTER" && monsterState === "PLAYING") {
        // Aim batter with mouse
        batter.x = Math.max(30, Math.min(WIDTH - 30, mousePos.x));
      }

    canvas.addEventListener("click", (e) => {
      const pos = getCoords(e);
      ensureAudio();

      // Sound Toggle Button (top-left)
      if (pos.x >= 10 && pos.x <= 95 && pos.y >= 6 && pos.y <= 28) {
        sfxEnabled = !sfxEnabled;
        if (sfxEnabled) {
          playPointSound();
          if (activeGame === "AIRCRAFT" && airState === "PLAYING") startAircraftEngine();
        } else {
          stopAircraftEngine();

        return;
      }

      if (activeGame === "MENU") {
        // Difficulty Tabs (Y: 52 to 74)
        if (pos.y >= 52 && pos.y <= 74) {

          if (pos.x >= 235 && pos.x <= 305) { gameDifficulty = "medium"; playMenuClickSound(); }

        }

        } else if (pos.x >= 190 && pos.x <= 350 && pos.y >= 88 && pos.y <= 295) {

          startAircraftEngine();
        } else if (pos.x >= 362 && pos.x <= 522 && pos.y >= 88 && pos.y <= 295) {
          playMenuClickSound(); initMonster(); activeGame = "MONSTER";
        }
      } else {
        // [◀ MENU] button in top-right

          activeGame = "MENU";
          stopAircraftEngine();
          return;
        }

        // Click to replay or next level in Game 1
        if (activeGame === "LOVERS") {
          if (loversState === "GAMEOVER") {
            initLoversLevel(loversLevel); return;
          }
          if (loversState === "REUNITED") {
            nextLoversLevel(); return;
          }
        }
        // Click in Game 2 (Shoot weapons or replay)
        if (activeGame === "AIRCRAFT") {
          if (airState === "PLAYING") fireAircraftWeapons();
          else if (airState === "GAMEOVER") { initAircraft(); startAircraftEngine(); return; }
        }
        // Monster Game Click
        if (activeGame === "MONSTER") {
          if (monsterState === "PLAYING") {
            swingBaseballBat();
          } else if (monsterState === "GAMEOVER") {
            initMonster();
          } else if (monsterState === "VICTORY" && rematchReady) {
            initMonster();
          }
        }
      }
    });


    /* ----------------------------------------------------
       GAME 1: KOGGY LOVERS MEET (Grid Puzzle, Square Snake Obstacles, Throbbing Pink Reunion)
       ---------------------------------------------------- */
    const LOV_COLS = 16;
    const LOV_ROWS = 10;
    const LOV_CELL = 30;
    const LOV_X = 30;
    const LOV_Y = 42;

    function drawHalfHeartSide(ctx, size) {
      const topY = -size * 0.25;
      const botY = size * 0.65;
      ctx.beginPath();
      ctx.moveTo(0, topY);
      ctx.bezierCurveTo(size * 0.35, -size * 0.85, size * 0.95, -size * 0.25, size * 0.75, size * 0.12);
      ctx.bezierCurveTo(size * 0.55, size * 0.45, size * 0.2, size * 0.55, 0, botY);
      ctx.lineTo(0, topY);
      ctx.closePath();
      ctx.fill();
    }

    function drawPixelHeart(ctx, cx, cy, size, side = "BOTH", color = "#ff4081") {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.fillStyle = color;
      if (side === "RIGHT" || side === "BOTH") {
        drawHalfHeartSide(ctx, size);
      }
      if (side === "LEFT" || side === "BOTH") {
        ctx.save();
        ctx.scale(-1, 1);
        drawHalfHeartSide(ctx, size);
        ctx.restore();
      }
      ctx.restore();
    }

    let loversLevel = 1;
    let loversState = "PLAYING"; // "PLAYING", "REUNITED", "GAMEOVER"
    let loversSteps = 0;
    let loversPlayer = { col: 1, row: 5, visualX: 0, visualY: 0 };
    let loversPartner = { col: 14, row: 5 };
    let loversWalls = []; // array of {col, row}
    let loversSnakes = []; // array of snake objects
    let loversSparkles = [];
    let loversAnimTimer = 0;
    let loversSnakeTimer = 0;

    function initLovers() {
      loversLevel = 1;
      initLoversLevel(loversLevel);
    }

    function initLoversLevel(lvl) {
      loversLevel = lvl;
      loversState = "PLAYING";
      loversSteps = 0;
      loversSparkles = [];
      loversAnimTimer = 0;
      loversSnakeTimer = 0;
      loversWalls = [];
      loversSnakes = [];

      // Level Designs
      if (lvl === 1) {
        // Level 1: Introduction - Vertical Patrol
        loversPlayer.col = 1;
        loversPlayer.row = 5;
        loversPartner.col = 14;
        loversPartner.row = 5;
        loversSnakes.push({
          segments: [{col: 7, row: 2}, {col: 7, row: 3}, {col: 7, row: 4}, {col: 7, row: 5}],
          dc: 0, dr: -1,
          type: "Y", minR: 1, maxR: 8
        });
      } else if (lvl === 2) {
        // Level 2: Divided Corridor with Barrier Walls
        loversPlayer.col = 1;
        loversPlayer.row = 2;
        loversPartner.col = 14;
        loversPartner.row = 7;
        for (let c = 0; c <= 5; c++) loversWalls.push({col: c, row: 4});
        for (let c = 9; c <= 15; c++) loversWalls.push({col: c, row: 4});
        loversSnakes.push({
          segments: [{col: 5, row: 5}, {col: 4, row: 5}, {col: 3, row: 5}, {col: 2, row: 5}, {col: 1, row: 5}],
          dc: 1, dr: 0,
          type: "X", minC: 1, maxC: 14
        });
      } else if (lvl === 3) {
        // Level 3: Twin Patrols
        loversPlayer.col = 1;
        loversPlayer.row = 8;
        loversPartner.col = 14;
        loversPartner.row = 1;
        loversWalls.push({col: 5, row: 4}, {col: 5, row: 5}, {col: 10, row: 4}, {col: 10, row: 5});
        loversSnakes.push({
          segments: [{col: 3, row: 3}, {col: 2, row: 3}, {col: 1, row: 3}, {col: 0, row: 3}],
          dc: 1, dr: 0,
          type: "X", minC: 1, maxC: 14
        });
        loversSnakes.push({
          segments: [{col: 12, row: 6}, {col: 13, row: 6}, {col: 14, row: 6}, {col: 15, row: 6}],
          dc: -1, dr: 0,
          type: "X", minC: 1, maxC: 14
        });
      } else if (lvl === 4) {
        // Level 4: The Courtyard Haven
        loversPlayer.col = 1;
        loversPlayer.row = 1;
        loversPartner.col = 8;
        loversPartner.row = 4;
        for (let c = 6; c <= 10; c++) {
          loversWalls.push({col: c, row: 3});
          loversWalls.push({col: c, row: 5});
        }
        loversWalls.push({col: 6, row: 4}); // Gate is open on right at (10, 4)
        loversSnakes.push({
          segments: [
            {col: 13, row: 4}, {col: 13, row: 3}, {col: 13, row: 2}, {col: 13, row: 1},
            {col: 12, row: 1}, {col: 11, row: 1}, {col: 10, row: 1}
          ],
          waypoints: [
            {col: 13, row: 8}, {col: 2, row: 8}, {col: 2, row: 1}, {col: 13, row: 1}
          ],
          wpIndex: 0,
          dc: 0, dr: 1,
          type: "WAYPOINTS"
        });
      } else if (lvl === 5) {
        // Level 5: Master Gauntlet
        loversPlayer.col = 1;
        loversPlayer.row = 5;
        loversPartner.col = 14;
        loversPartner.row = 5;
        for (let r = 2; r <= 7; r++) {
          if (r !== 5) loversWalls.push({col: 5, row: r}, {col: 10, row: r});
        }
        loversSnakes.push({
          segments: [{col: 7, row: 2}, {col: 7, row: 3}, {col: 7, row: 4}, {col: 7, row: 5}],
          dc: 0, dr: 1,
          type: "Y", minR: 1, maxR: 8
        });
        loversSnakes.push({
          segments: [{col: 8, row: 7}, {col: 8, row: 6}, {col: 8, row: 5}, {col: 8, row: 4}],
          dc: 0, dr: -1,
          type: "Y", minR: 1, maxR: 8
        });
      } else if (lvl === 6) {
        // Level 6: Zig-Zag Alley
        loversPlayer.col = 1;
        loversPlayer.row = 1;
        loversPartner.col = 14;
        loversPartner.row = 8;
        // Upper wall with gap on right
        for (let c = 0; c <= 11; c++) loversWalls.push({col: c, row: 3});
        // Lower wall with gap on left
        for (let c = 4; c <= 15; c++) loversWalls.push({col: c, row: 6});
        // Snakes patrolling corridors
        loversSnakes.push({
          segments: [{col: 5, row: 1}, {col: 4, row: 1}, {col: 3, row: 1}, {col: 2, row: 1}],
          dc: 1, dr: 0,
          type: "X", minC: 1, maxC: 14
        });
        loversSnakes.push({
          segments: [{col: 10, row: 4}, {col: 9, row: 4}, {col: 8, row: 4}, {col: 7, row: 4}],
          dc: -1, dr: 0,
          type: "X", minC: 1, maxC: 14
        });
        loversSnakes.push({
          segments: [{col: 6, row: 8}, {col: 5, row: 8}, {col: 4, row: 8}, {col: 3, row: 8}],
          dc: 1, dr: 0,
          type: "X", minC: 1, maxC: 13
        });
      } else if (lvl === 7) {
        // Level 7: Four Quadrants
        loversPlayer.col = 1;
        loversPlayer.row = 8;
        loversPartner.col = 8;
        loversPartner.row = 4;
        // Cross divider walls
        for (let c = 2; c <= 5; c++) loversWalls.push({col: c, row: 4});
        for (let c = 10; c <= 13; c++) loversWalls.push({col: c, row: 4});
        for (let r = 0; r <= 2; r++) loversWalls.push({col: 8, row: r});
        for (let r = 6; r <= 9; r++) loversWalls.push({col: 8, row: r});
        // Guard snakes
        loversSnakes.push({
          segments: [{col: 12, row: 1}, {col: 12, row: 2}, {col: 12, row: 3}, {col: 12, row: 4}],
          dc: 0, dr: 1,
          type: "Y", minR: 1, maxR: 7
        });
        loversSnakes.push({
          segments: [{col: 4, row: 7}, {col: 4, row: 6}, {col: 4, row: 5}, {col: 4, row: 4}],
          dc: 0, dr: -1,
          type: "Y", minR: 2, maxR: 8
        });
      } else if (lvl === 8) {
        // Level 8: The Orbital Rings (Dual Orbiting Loopers)
        loversPlayer.col = 1;
        loversPlayer.row = 1;
        loversPartner.col = 14;
        loversPartner.row = 8;
        // Center obstacle box
        for (let c = 6; c <= 9; c++) {
          loversWalls.push({col: c, row: 4}, {col: c, row: 5});
        }
        // Outer loop snake (clockwise)
        loversSnakes.push({
          segments: [
            {col: 3, row: 2}, {col: 2, row: 2}, {col: 2, row: 3}, {col: 2, row: 4}, {col: 2, row: 5}
          ],
          waypoints: [
            {col: 13, row: 2}, {col: 13, row: 7}, {col: 2, row: 7}, {col: 2, row: 2}
          ],
          wpIndex: 0,
          dc: 1, dr: 0,
          type: "WAYPOINTS"
        });
        // Inner loop snake (counter-clockwise)
        loversSnakes.push({
          segments: [
            {col: 10, row: 7}, {col: 11, row: 7}, {col: 11, row: 6}, {col: 11, row: 5}
          ],
          waypoints: [
            {col: 4, row: 7}, {col: 4, row: 2}, {col: 11, row: 2}, {col: 11, row: 7}
          ],
          wpIndex: 0,
          dc: -1, dr: 0,
          type: "WAYPOINTS"
        });
      } else if (lvl === 9) {
        // Level 9: Crossfire Gauntlet (3 intersecting snakes)
        loversPlayer.col = 1;
        loversPlayer.row = 5;
        loversPartner.col = 14;
        loversPartner.row = 5;
        loversWalls.push({col: 4, row: 3}, {col: 4, row: 7}, {col: 11, row: 3}, {col: 11, row: 7});
        // 2 Vertical gatekeepers
        loversSnakes.push({
          segments: [{col: 4, row: 2}, {col: 4, row: 3}, {col: 4, row: 4}, {col: 4, row: 5}],
          dc: 0, dr: 1,
          type: "Y", minR: 1, maxR: 8
        });
        loversSnakes.push({
          segments: [{col: 11, row: 7}, {col: 11, row: 6}, {col: 11, row: 5}, {col: 11, row: 4}],
          dc: 0, dr: -1,
          type: "Y", minR: 1, maxR: 8
        });
        // 1 Horizontal center patrol
        loversSnakes.push({
          segments: [{col: 6, row: 5}, {col: 7, row: 5}, {col: 8, row: 5}, {col: 9, row: 5}],
          dc: 1, dr: 0,
          type: "X", minC: 5, maxC: 10
        });
      } else if (lvl === 10) {
        // Level 10: The Grand Labyrinth
        loversPlayer.col = 1;
        loversPlayer.row = 1;
        loversPartner.col = 14;
        loversPartner.row = 8;
        // Maze walls
        for (let r = 1; r <= 8; r += 2) {
          if (r % 4 === 1) {
            for (let c = 2; c <= 12; c++) loversWalls.push({col: c, row: r});
          } else {
            for (let c = 4; c <= 14; c++) loversWalls.push({col: c, row: r});
          }
        }
        loversSnakes.push({
          segments: [{col: 2, row: 2}, {col: 1, row: 2}, {col: 0, row: 2}],
          dc: 1, dr: 0,
          type: "X", minC: 0, maxC: 15
        });
        loversSnakes.push({
          segments: [{col: 13, row: 6}, {col: 14, row: 6}, {col: 15, row: 6}],
          dc: -1, dr: 0,
          type: "X", minC: 0, maxC: 15
        });
      } else {
        // Level 11+: Infinite Procedural Generator (Every level is uniquely generated!)
        const seed = lvl * 7919;
        function rnd(offset) {
          const s = Math.sin(seed + offset * 133.7) * 43758.5453;
          return s - Math.floor(s);
        }

        // Dynamic player and partner placement
        const pSide = rnd(1) > 0.5;
        loversPlayer.col = pSide ? 1 : 14;
        loversPlayer.row = 1 + Math.floor(rnd(2) * 8);
        loversPartner.col = pSide ? 14 : 1;
        loversPartner.row = 1 + Math.floor(rnd(3) * 8);

        // Procedural pillar walls (ensuring player and partner are clear)
        const numPillars = 4 + (lvl % 5);
        for (let p = 0; p < numPillars; p++) {
          const wc = 3 + Math.floor(rnd(10 + p) * 10);
          const wr = 1 + Math.floor(rnd(20 + p) * 8);
          if (Math.abs(wc - loversPlayer.col) > 1 || Math.abs(wr - loversPlayer.row) > 1) {
            if (Math.abs(wc - loversPartner.col) > 1 || Math.abs(wr - loversPartner.row) > 1) {
              loversWalls.push({col: wc, row: wr});
            }
          }
        }

        // Procedural snakes (2 to 4 snakes depending on level)
        const snakeCount = Math.min(4, 2 + Math.floor((lvl - 10) / 4));
        for (let s = 0; s < snakeCount; s++) {
          const isHoriz = rnd(30 + s) > 0.5;
          const segLen = 4 + (s % 3);
          let validSnake = null;

          // Find candidate placement with strict safe distance from player & partner
          for (let attempt = 0; attempt < 30; attempt++) {
            const segs = [];
            let safe = true;

            if (isHoriz) {
              const row = 1 + Math.floor(rnd(40 + s + attempt * 7) * 8);
              const minC = 2;
              const maxC = 13;
              const startC = minC + Math.floor(rnd(50 + s + attempt * 7) * Math.max(1, (maxC - minC - segLen)));
              for (let i = 0; i < segLen; i++) {
                const sc = startC + i;
                segs.push({col: sc, row: row});
                // Minimum safe distance: 3 cells from player, 2 cells from partner
                if (Math.abs(sc - loversPlayer.col) + Math.abs(row - loversPlayer.row) < 3) safe = false;
                if (Math.abs(sc - loversPartner.col) + Math.abs(row - loversPartner.row) < 2) safe = false;
              }
              if (safe) {
                validSnake = {
                  segments: segs,
                  dc: rnd(60 + s) > 0.5 ? 1 : -1, dr: 0,
                  type: "X", minC: minC, maxC: maxC
                };
                break;
              }
            } else {
              const col = 2 + Math.floor(rnd(70 + s + attempt * 7) * 12);
              const minR = 1;
              const maxR = 8;
              const startR = minR + Math.floor(rnd(80 + s + attempt * 7) * Math.max(1, (maxR - minR - segLen)));
              for (let i = 0; i < segLen; i++) {
                const sr = startR + i;
                segs.push({col: col, row: sr});
                if (Math.abs(col - loversPlayer.col) + Math.abs(sr - loversPlayer.row) < 3) safe = false;
                if (Math.abs(col - loversPartner.col) + Math.abs(sr - loversPartner.row) < 2) safe = false;
              }
              if (safe) {
                validSnake = {
                  segments: segs,
                  dc: 0, dr: rnd(90 + s) > 0.5 ? 1 : -1,
                  type: "Y", minR: minR, maxR: maxR
                };
                break;
              }
            }
          }

          if (validSnake) {
            loversSnakes.push(validSnake);
          }
        }
      }

      // ABSOLUTE SPAWN SAFETY SHIELD:
      // Remove any snake segment within a 2-cell radius of the player at spawn
      loversSnakes.forEach(s => {
        s.segments = s.segments.filter(seg => {
          const distToPlayer = Math.abs(seg.col - loversPlayer.col) + Math.abs(seg.row - loversPlayer.row);
          return distToPlayer >= 2;
        });
      });
      // Filter out empty snakes if any
      loversSnakes = loversSnakes.filter(s => s.segments.length > 0);

      loversPlayer.visualX = LOV_X + loversPlayer.col * LOV_CELL;
      loversPlayer.visualY = LOV_Y + loversPlayer.row * LOV_CELL;
    }

    function moveLoversPlayer(dc, dr) {
      if (loversState !== "PLAYING") return;
      const targetC = loversPlayer.col + dc;
      const targetR = loversPlayer.row + dr;

      // Grid boundaries
      if (targetC < 0 || targetC >= LOV_COLS || targetR < 0 || targetR >= LOV_ROWS) return;

      // Obstacle wall collision
      for (const w of loversWalls) {
        if (w.col === targetC && w.row === targetR) return;
      }

      loversPlayer.col = targetC;
      loversPlayer.row = targetR;
      loversSteps++;
      playStepSound();

      // Check collision with square snakes
      for (const s of loversSnakes) {
        for (const seg of s.segments) {
          if (seg.col === loversPlayer.col && seg.row === loversPlayer.row) {
            triggerLoversFail();
            return;
          }
        }
      }

      // Check reunion with lover!
      if (loversPlayer.col === loversPartner.col && loversPlayer.row === loversPartner.row) {
        triggerLoversReunion();
      }
    }

    function triggerLoversReunion() {
      loversState = "REUNITED";
      loversAnimTimer = 0;
      triggerCameraJuice();
      playReunionChime();
      playVictoryFanfare();

      const px = LOV_X + loversPartner.col * LOV_CELL + LOV_CELL / 2;
      const py = LOV_Y + loversPartner.row * LOV_CELL + LOV_CELL / 2;
      for (let i = 0; i < 35; i++) {
        loversSparkles.push({
          x: px, y: py,
          vx: (Math.random() - 0.5) * 5,
          vy: -1.2 - Math.random() * 4,
          color: Math.random() > 0.35 ? "#ff4081" : "#ffffff",
          alpha: 1.0,
          size: 2 + Math.random() * 4
        });
      }
    }

    function triggerLoversFail() {
      loversState = "GAMEOVER";
      loversAnimTimer = 0;
      triggerCameraJuice();
      playCrashSound();
      playGameOverSound();

      const px = LOV_X + loversPlayer.col * LOV_CELL + LOV_CELL / 2;
      const py = LOV_Y + loversPlayer.row * LOV_CELL + LOV_CELL / 2;
      for (let i = 0; i < 25; i++) {
        loversSparkles.push({
          x: px, y: py,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          color: "#ffffff",
          alpha: 1.0,
          size: 2 + Math.random() * 3
        });
      }
    }

    function nextLoversLevel() {
      loversLevel++;
      initLoversLevel(loversLevel);
    }

    function runLovers() {
      loversAnimTimer++;
      const spdMult = gameDifficulty === "easy" ? 1.4 : (gameDifficulty === "hard" ? 0.75 : 1.0);
      const snakeInterval = Math.max(8, Math.round(16 * spdMult));

      // 1. UPDATE SQUARE SNAKES
      if (loversState === "PLAYING") {
        loversSnakeTimer++;
        if (loversSnakeTimer >= snakeInterval) {
          loversSnakeTimer = 0;

          loversSnakes.forEach(s => {
            const head = s.segments[0];

            if (s.type === "WAYPOINTS") {
              const target = s.waypoints[s.wpIndex];
              const dc = Math.sign(target.col - head.col);
              const dr = Math.sign(target.row - head.row);
              if (dc !== 0) { s.dc = dc; s.dr = 0; }
              else if (dr !== 0) { s.dc = 0; s.dr = dr; }

              let nextC = head.col + s.dc;
              let nextR = head.row + s.dr;

              if (nextC === target.col && nextR === target.row) {
                s.wpIndex = (s.wpIndex + 1) % s.waypoints.length;
              }
              s.segments.unshift({ col: nextC, row: nextR });
              s.segments.pop();
            } else {
              let nextC = head.col + s.dc;
              let nextR = head.row + s.dr;

              // Reverse patrol when hitting limits
              if (s.type === "X") {
                if (nextC < s.minC || nextC > s.maxC) {
                  s.dc = -s.dc;
                  nextC = head.col + s.dc;
                }
              } else if (s.type === "Y") {
                if (nextR < s.minR || nextR > s.maxR) {
                  s.dr = -s.dr;
                  nextR = head.row + s.dr;
                }
              }
              s.segments.unshift({ col: nextC, row: nextR });
              s.segments.pop();
            }

            // Check if moving snake strikes the player
            for (const seg of s.segments) {
              if (seg.col === loversPlayer.col && seg.row === loversPlayer.row) {
                triggerLoversFail();
                break;
              }
            }
          });
        }
      }

      // Smooth visual interpolation for the player's movement
      const targetVisualX = LOV_X + loversPlayer.col * LOV_CELL;
      const targetVisualY = LOV_Y + loversPlayer.row * LOV_CELL;
      loversPlayer.visualX += (targetVisualX - loversPlayer.visualX) * 0.4;
      loversPlayer.visualY += (targetVisualY - loversPlayer.visualY) * 0.4;

      // 2. DRAW PLAYING GRID FLOOR & ARENA
      ctx.fillStyle = "#0a0a0a";
      ctx.fillRect(LOV_X, LOV_Y, LOV_COLS * LOV_CELL, LOV_ROWS * LOV_CELL);
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(LOV_X, LOV_Y, LOV_COLS * LOV_CELL, LOV_ROWS * LOV_CELL);

      // Subtle grid dots
      ctx.fillStyle = "#222222";
      for (let c = 0; c < LOV_COLS; c++) {
        for (let r = 0; r < LOV_ROWS; r++) {
          ctx.fillRect(LOV_X + c * LOV_CELL + 14, LOV_Y + r * LOV_CELL + 14, 2, 2);
        }
      }

      // 3. DRAW BARRIER WALLS
      loversWalls.forEach(w => {
        const wx = LOV_X + w.col * LOV_CELL;
        const wy = LOV_Y + w.row * LOV_CELL;
        ctx.fillStyle = "#151515";
        ctx.fillRect(wx + 2, wy + 2, LOV_CELL - 4, LOV_CELL - 4);
        ctx.strokeStyle = "#666666";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(wx + 2, wy + 2, LOV_CELL - 4, LOV_CELL - 4);
        ctx.beginPath();
        ctx.moveTo(wx + 4, wy + 4); ctx.lineTo(wx + LOV_CELL - 4, wy + LOV_CELL - 4);
        ctx.stroke();
      });

      // 4. DRAW SQUARE SNAKES (Obstacles)
      loversSnakes.forEach(s => {
        s.segments.forEach((seg, idx) => {
          const sx = LOV_X + seg.col * LOV_CELL;
          const sy = LOV_Y + seg.row * LOV_CELL;
          const sz = LOV_CELL - 6;

          if (idx === 0) {
            // Snake Head: Bold white square with directional eyes
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(sx + 3, sy + 3, sz, sz);
            ctx.fillStyle = "#000000";
            // Eyes
            const eyeOffset = s.dc === 1 ? 5 : (s.dc === -1 ? -5 : 0);
            const eyeOffsetY = s.dr === 1 ? 5 : (s.dr === -1 ? -5 : 0);
            ctx.fillRect(sx + LOV_CELL/2 - 5 + eyeOffset, sy + LOV_CELL/2 - 4 + eyeOffsetY, 3, 3);
            ctx.fillRect(sx + LOV_CELL/2 + 2 + eyeOffset, sy + LOV_CELL/2 - 4 + eyeOffsetY, 3, 3);
          } else {
            // Snake Body Segments: Sleek dark square with white border
            ctx.fillStyle = "#121212";
            ctx.fillRect(sx + 3, sy + 3, sz, sz);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(sx + 3, sy + 3, sz, sz);
            // Inner diamond
            ctx.fillStyle = "#444444";
            ctx.beginPath();
            ctx.moveTo(sx + LOV_CELL/2, sy + 7);
            ctx.lineTo(sx + LOV_CELL - 7, sy + LOV_CELL/2);
            ctx.lineTo(sx + LOV_CELL/2, sy + LOV_CELL - 7);
            ctx.lineTo(sx + 7, sy + LOV_CELL/2);
            ctx.closePath();
            ctx.fill();
          }
        });
      });

      // 5. DRAW PARTNER SQUARE & PLAYER SQUARE (OR MERGED UNITED SQUARE)

      // 6. DRAW SPARKLES

        ctx.fillStyle = "#ffffff";

    function drawVerticalJet(x, y, name, rollAngle = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rollAngle); // Clear banking tilt on left/right movement!

      // 1. THICK, PROMINENT SPEED LINES & EXHAUST TRAILS
      const flameLen = 20 + Math.random() * 24;
      const wingTrailLen = 14 + Math.random() * 18;

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 3.5; // Bold & prominent!

      // Center Twin Jet Exhaust Streaks
      ctx.beginPath();
      ctx.moveTo(-4, 15);
      ctx.lineTo(-4, 15 + flameLen);
      ctx.moveTo(4, 15);
      ctx.lineTo(4, 15 + flameLen);
      ctx.stroke();

      // Wingtip Vapor Trails
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-12, 12);
      ctx.lineTo(-12, 12 + wingTrailLen);
      ctx.moveTo(12, 12);
      ctx.lineTo(12, 12 + wingTrailLen);
      ctx.stroke();

      // Trailing Sonic Dash Particles
      if (Math.random() > 0.25) {
        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(255, 255, 255, 0.75)";
        const streakX = (Math.random() - 0.5) * 32;
        const streakY = 24 + Math.random() * 22;
        ctx.beginPath();
        ctx.moveTo(streakX, streakY);
        ctx.lineTo(streakX, streakY + 28);
        ctx.stroke();
      }

      // 2. JET BODY
      ctx.strokeStyle = "#ffffff";
      ctx.fillStyle = "#000000";
      ctx.lineWidth = 2.5;

      ctx.beginPath();
      ctx.moveTo(0, -18);      // Nose
      ctx.lineTo(12, 10);      // Right wing
      ctx.lineTo(4, 6);
      ctx.lineTo(12, 16);      // Right tail
      ctx.lineTo(0, 13);       // Engine
      ctx.lineTo(-12, 16);     // Left tail
      ctx.lineTo(-4, 6);
      ctx.lineTo(-12, 10);     // Left wing
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Cockpit
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(-2, -6, 4, 8);

      // 3. PILOT USERNAME (Positioned cleanly above nose)
      if (name) {
        ctx.font = "900 10px monospace";
        ctx.fillStyle = "#000000";
        const txtW = ctx.measureText(name).width;
        ctx.fillRect(-txtW/2 - 4, -34, txtW + 8, 14);
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1;
        ctx.strokeRect(-txtW/2 - 4, -34, txtW + 8, 14);

        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.fillText(name, 0, -23);
      }

      ctx.restore();
    }

    function runAircraft() {
      airFrame++;
      const spdMult = gameDifficulty === "easy" ? 0.75 : (gameDifficulty === "hard" ? 1.3 : 1.0);
      const spawnRate = gameDifficulty === "easy" ? 56 : (gameDifficulty === "hard" ? 36 : 46);

      // 1. DYNAMIC VERTICAL PARALLAX FLIGHT SKY
      // Layer A: Distant Stars
      ctx.fillStyle = "#ffffff";
      airStars.forEach(s => {
        s.y += s.speed;
        if (s.y > HEIGHT) { s.y = 0; s.x = Math.random() * WIDTH; }
        ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });

      // Layer B: Medium Altitude Geometric Cloud Wireframes
      ctx.lineWidth = 1;
      airClouds.forEach(c => {
        c.y += c.speed;
        if (c.y > HEIGHT + 40) { c.y = -30; c.x = Math.random() * WIDTH; }
        ctx.strokeStyle = `rgba(255, 255, 255, ${c.alpha})`;
        ctx.strokeRect(c.x, c.y, c.w, c.h);
      });

      // Layer C: Supersonic Wind Streak Lines (high velocity rush)
      ctx.strokeStyle = "rgba(255, 255, 255, 0.22)";
      ctx.lineWidth = 1;
      airSpeedLines.forEach(wl => {
        wl.y += wl.speed;
        if (wl.y > HEIGHT + 50) { wl.y = -50; wl.x = Math.random() * WIDTH; }
        ctx.beginPath();
        ctx.moveTo(wl.x, wl.y);
        ctx.lineTo(wl.x, wl.y + wl.len);
        ctx.stroke();
      });

      if (airState === "PLAYING") {
        airScore++;

        // Continuous Aircraft Jet Thruster Loop
        if (sfxEnabled) {
          if (!engineRunning) startAircraftEngine();
          updateAircraftEngine(craftRoll);
        } else if (engineRunning) {
          stopAircraftEngine();
        }

        // Keyboard movement
        if (keys["ArrowLeft"] || keys["a"] || keys["A"]) airCraftX -= 6;
        if (keys["ArrowRight"] || keys["d"] || keys["D"]) airCraftX += 6;
        if (keys["ArrowUp"] || keys["w"] || keys["W"]) airCraftY -= 5;
        if (keys["ArrowDown"] || keys["s"] || keys["S"]) airCraftY += 5;

        airCraftX = Math.max(60, Math.min(WIDTH - 60, airCraftX));
        airCraftY = Math.max(80, Math.min(HEIGHT - 50, airCraftY));

        // Detect horizontal velocity (works with BOTH mouse and keyboard!)
        const deltaX = airCraftX - lastAirCraftX;
        lastAirCraftX = airCraftX;

        // Dynamic banking rotation: tilt left on left move, tilt right on right move
        if (deltaX < -0.8) craftTargetRoll = -0.32; // ~18 degrees tilt left
        else if (deltaX > 0.8) craftTargetRoll = 0.32; // ~18 degrees tilt right
        else craftTargetRoll = 0; // Level out when flying straight

        // Smooth roll interpolation
        craftRoll += (craftTargetRoll - craftRoll) * 0.22;

        // RHYTHMIC 20-SECOND BOSS DUCK CYCLE
        airDuckTimer++;

        // IMPASSABLE BARRICADE CYCLE: EVERY ~12 SECONDS (720 frames, when duck is inactive)
        if (airDuckWarning === 0 && airGiantDucks.length === 0) {
          airWallTimer++;
          if (airWallTimer >= 720) {
            airWallTimer = 0;
            airWallWarning = 75; // ~1.25s warning!
            playBossWarningSound();
          }
        }

        // Spawn Full Impassable Barricade Wall when warning reaches 1
        if (airWallWarning === 1) {
          for (let c = 0; c < 10; c++) {
            airWalls.push({
              x: c * 54,
              y: -36,
              w: 54,
              h: 30,
              hp: gameDifficulty === "hard" ? 3 : 2,
              maxHp: gameDifficulty === "hard" ? 3 : 2,
              speed: 2.2 * spdMult,
              destroyed: false
            });
          }
        }

        // Only spawn regular blocks if NO duck and NO barricade is active!
        if (airDuckWarning === 0 && airGiantDucks.length === 0 && airWallWarning === 0 && airWalls.length === 0) {
          if (airFrame % spawnRate === 0) {
            const gapX = 40 + Math.random() * (WIDTH - 160);
            airObstacles.push({
              x: gapX,
              y: -30,
              w: 36,
              h: 36,
              speed: (3.0 + Math.random() * 1.4) * spdMult,
              rot: 0
            });
          }
        }

        // TRIGGER GIANT DUCK EVENT: EXACTLY EVERY 20 SECONDS (1200 frames)
        if (airDuckTimer >= 1200) {
          airDuckTimer = 0;
          airDuckWarning = 150; // Long 2.5-second warning!
          playBossWarningSound();

          // DISSOLVE ALL OBSTACLES & WALLS: Clears whole arena so aircraft has total room!
          airObstacles.forEach(o => {
            for (let p = 0; p < 8; p++) {
              airDissolveParticles.push({
                x: o.x + Math.random() * o.w,
                y: o.y + Math.random() * o.h,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 6,
                size: 2 + Math.random() * 3,
                alpha: 1.0
              });
            }
          });
          airObstacles = [];

          airWalls.forEach(b => {
            if (!b.destroyed) {
              for (let p = 0; p < 6; p++) {
                airDissolveParticles.push({
                  x: b.x + Math.random() * b.w,
                  y: b.y + Math.random() * b.h,
                  vx: (Math.random() - 0.5) * 6,
                  vy: (Math.random() - 0.5) * 6,
                  size: 3,
                  alpha: 1.0
                });
              }
            }
          });
          airWalls = [];
          playDissolveSound();
        }

        // Spawn Giant Duck: BIGGER & THROWN with "QUACK QUACK! I'M CROSSING!"
        if (airDuckWarning === 35) {
          playQuackSound();
          setTimeout(() => { playQuackSound(); }, 160); // Quack quack!
          setTimeout(() => { playQuackSound(); }, 360); // "I'm crossing!"
          const startX = Math.random() > 0.5 ? 90 : WIDTH - 90;
          const throwVx = ((airCraftX - startX) / 110);
          airGiantDucks.push({
            x: startX,
            y: -110,
            vx: throwVx,
            scale: 4.5, // EVEN BIGGER DUCK!
            speed: 2.1 * spdMult,
            waddle: 0,
            radius: 46, // Fair hitbox
            hp: 8
          });
        }

        // Update Aircraft Lasers / Projectiles
        for (let i = airLasers.length - 1; i >= 0; i--) {
          const l = airLasers[i];
          l.x += (l.vx || 0);
          l.y += l.vy;

          // Hit Barricade Wall Blocks (BLAST THE WALL!)
          let laserHit = false;
          for (let j = 0; j < airWalls.length; j++) {
            const b = airWalls[j];
            if (!b.destroyed && l.x > b.x && l.x < b.x + b.w && l.y > b.y && l.y < b.y + b.h) {
              b.hp--;
              playHitSound();
              laserHit = true;
              for (let p = 0; p < 6; p++) {
                airDissolveParticles.push({
                  x: l.x, y: l.y,
                  vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5,
                  size: 2 + Math.random() * 3, alpha: 1.0
                });
              }
              if (b.hp <= 0) {
                b.destroyed = true;
                playDissolveSound();
                triggerCameraJuice();
                airScore += 30; // Big bonus for blasting a hole!
                for (let p = 0; p < 14; p++) {
                  airDissolveParticles.push({
                    x: b.x + Math.random() * b.w, y: b.y + Math.random() * b.h,
                    vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.5) * 7,
                    size: 3 + Math.random() * 3, alpha: 1.0
                  });
                }
              }
              break;
            }
          }
          if (laserHit) {
            airLasers.splice(i, 1);
            continue;
          }

          // Hit obstacles
          for (let j = airObstacles.length - 1; j >= 0; j--) {
            const o = airObstacles[j];
            if (l.x > o.x && l.x < o.x + o.w && l.y > o.y && l.y < o.y + o.h) {
              for (let p = 0; p < 6; p++) {
                airDissolveParticles.push({
                  x: l.x, y: l.y,
                  vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5,
                  size: 2 + Math.random() * 3, alpha: 1.0
                });
              }
              airObstacles.splice(j, 1);
              laserHit = true;
              playDissolveSound();
              airScore += 10;
              break;
            }
          }
          if (laserHit) {
            airLasers.splice(i, 1);
            continue;
          }

          // Hit Giant Duck
          for (let j = airGiantDucks.length - 1; j >= 0; j--) {
            const gd = airGiantDucks[j];
            if (Math.hypot(l.x - gd.x, l.y - gd.y) < gd.radius + 6) {
              gd.hp--;
              playQuackSound();
              triggerCameraJuice();
              for (let p = 0; p < 6; p++) {
                airDissolveParticles.push({
                  x: l.x, y: l.y,
                  vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
                  size: 3, alpha: 1.0
                });
              }
              airLasers.splice(i, 1);
              if (gd.hp <= 0) {
                playVictoryFanfare();
                airScore += 100;
                airGiantDucks.splice(j, 1);
              }
              break;
            }
          }

          if (l.y < -20 || l.x < -20 || l.x > WIDTH + 20) airLasers.splice(i, 1);
        }

        const c1 = { x: airCraftX - 22, y: airCraftY, r: 12 };
        const c2 = { x: airCraftX + 22, y: airCraftY + 12, r: 12 };

        function checkCircBox(c, b) {
          const nearX = Math.max(b.x, Math.min(c.x, b.x + b.w));
          const nearY = Math.max(b.y, Math.min(c.y, b.y + b.h));
          const dx = c.x - nearX;
          const dy = c.y - nearY;
          return (dx * dx + dy * dy) < (c.r * c.r);
        }

        // Update Barricade Wall Blocks (Collision with plane)
        for (let i = airWalls.length - 1; i >= 0; i--) {
          const b = airWalls[i];
          b.y += b.speed;

          if (!b.destroyed) {
            if (checkCircBox(c1, b) || checkCircBox(c2, b)) {
              airState = "GAMEOVER";
              stopAircraftEngine();
              triggerCameraJuice();
              playCrashSound();
              playGameOverSound();
            }
          }

          if (b.y > HEIGHT + 40) airWalls.splice(i, 1);
        }

        // Update Standard Obstacles
        for (let i = airObstacles.length - 1; i >= 0; i--) {
          const o = airObstacles[i];
          o.y += o.speed;
          o.rot += 0.03;

          if (checkCircBox(c1, o) || checkCircBox(c2, o)) {
            airState = "GAMEOVER";
            stopAircraftEngine();
            triggerCameraJuice();
            playCrashSound();
            playGameOverSound();
          }

          if (o.y > HEIGHT + 40) airObstacles.splice(i, 1);
        }

        // Update Giant Ducks (Dynamically Swooping / Thrown trajectory!)
        for (let i = airGiantDucks.length - 1; i >= 0; i--) {
          const gd = airGiantDucks[i];
          gd.x += gd.vx + Math.sin(gd.waddle) * 1.5; // Thrown swooping arc!
          gd.y += gd.speed;
          gd.waddle += 0.08;

          const c1 = { x: airCraftX - 22, y: airCraftY, r: 12 };
          const c2 = { x: airCraftX + 22, y: airCraftY + 12, r: 12 };

          const dist1 = Math.hypot(c1.x - gd.x, c1.y - gd.y);
          const dist2 = Math.hypot(c2.x - gd.x, c2.y - gd.y);

      prevHoveredCardIdx = curCardHover;

      drawGameCard(18, 88, 160, 206, 1, "LOVERS MEET", "Unite half-hearts • Grid", renderLoversThumb, curCardHover === 0);
      drawGameCard(190, 88, 160, 206, 2, "KOGGY AIRCRAFT", "Fly jets @v11ddx & @dhd.exe", renderAirThumb, curCardHover === 1);
      drawGameCard(362, 88, 160, 206, 3, "MONSTER BOSS", "Hit boss with bat & jump/dash", renderMonsterThumb, curCardHover === 2);

      // Bottom Note
      ctx.font = "bold 11px monospace";
      ctx.fillStyle = "#888888";
      ctx.textAlign = "center";
      ctx.fillText("[ Press ESC or click MENU anytime to return ]", WIDTH / 2, 335);
    }

    function drawGameCard(x, y, w, h, num, title, desc, thumbFunc, isHovered) {
      // Pop Up upward by 7px when hovered
      const drawY = isHovered ? y - 7 : y;

      ctx.save();
      if (isHovered) {
        ctx.shadowColor = "rgba(255, 255, 255, 0.45)";
        ctx.shadowBlur = 16;
        ctx.shadowOffsetY = 6;
      }

      ctx.fillStyle = isHovered ? "#161616" : "#000000";
      ctx.fillRect(x, drawY, w, h);
      ctx.strokeStyle = isHovered ? "#ffffff" : "#444444";
      ctx.lineWidth = isHovered ? 2.5 : 1.5;
      ctx.strokeRect(x, drawY, w, h);
      ctx.restore();

      const tbX = x + 16;
      const tbY = drawY + 14;
      const tbW = w - 32;
      const tbH = 88;
      ctx.fillStyle = "#080808";
      ctx.fillRect(tbX, tbY, tbW, tbH);
      ctx.strokeStyle = isHovered ? "#ffffff" : "#2a2a2a";
      ctx.lineWidth = 1;
      ctx.strokeRect(tbX, tbY, tbW, tbH);

      ctx.save();
      if (isHovered) {
        ctx.translate(tbX + tbW/2, tbY + tbH/2);
        ctx.scale(1.05, 1.05);
        ctx.translate(-(tbX + tbW/2), -(tbY + tbH/2));
      }
      thumbFunc(tbX + tbW/2, tbY + tbH/2);
      ctx.restore();

      ctx.fillStyle = "#ffffff";
      ctx.font = isHovered ? "900 12.5px monospace" : "900 12px monospace";
      ctx.textAlign = "center";
      ctx.fillText(`${num}. ${title}`, x + w/2, drawY + 124);

      ctx.fillStyle = isHovered ? "#dddddd" : "#888888";
      ctx.font = "10px monospace";
      ctx.fillText(desc, x + w/2, drawY + 146);

      if (isHovered) {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(x + 18, drawY + 166, w - 36, 26);
        ctx.fillStyle = "#000000";
        ctx.font = "900 11.5px monospace";
        ctx.fillText("▶ PLAY", x + w/2, drawY + 183);
      } else {
        ctx.strokeStyle = "#555555";
        ctx.strokeRect(x + 20, drawY + 168, w - 40, 24);
        ctx.fillStyle = "#888888";
        ctx.font = "bold 11px monospace";
        ctx.fillText("SELECT", x + w/2, drawY + 184);
      }
    }

    function renderLoversThumb(cx, cy) {
      // Left Square (Player) with left half heart
      ctx.fillStyle = "#000000";
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.5;
      ctx.fillRect(cx - 36, cy - 14, 24, 24);
      ctx.strokeRect(cx - 36, cy - 14, 24, 24);
      drawPixelHeart(ctx, cx - 24, cy - 2, 9, "LEFT", "#ff80ab");

      // Right Square (Partner) with right half heart
      ctx.fillRect(cx + 12, cy - 14, 24, 24);
      ctx.strokeRect(cx + 12, cy - 14, 24, 24);
      drawPixelHeart(ctx, cx + 24, cy - 2, 9, "RIGHT", "#ff80ab");

      // Trailing Love Dots between them
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(cx - 6, cy - 3, 3, 3);
      ctx.fillRect(cx - 1, cy - 3, 3, 3);
      ctx.fillRect(cx + 4, cy - 3, 3, 3);

      // Cute Little Throbbing Heart in center above
      const pulse = 1.0 + Math.sin(Date.now() * 0.006) * 0.22;
      drawPixelHeart(ctx, cx, cy - 26, 8 * pulse, "BOTH", "#ff4081");

      // Mini Square Snake Obstacle patrolling below!
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(cx - 16, cy + 18, 8, 8); // Snake head
      ctx.fillStyle = "#000000";
      ctx.fillRect(cx - 14, cy + 20, 2, 2);
      ctx.fillRect(cx - 10, cy + 20, 2, 2);
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1;
      ctx.strokeRect(cx - 6, cy + 18, 8, 8); // Body 1
      ctx.strokeRect(cx + 4, cy + 18, 8, 8); // Body 2
      ctx.strokeRect(cx + 14, cy + 18, 8, 8); // Body 3
    }

    function renderAirThumb(cx, cy) {
      drawVerticalJet(cx - 14, cy + 8, "");
      drawVerticalJet(cx + 14, cy - 8, "");
    }

    function renderMonsterThumb(cx, cy) {
      ctx.fillStyle = "#000000";
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.fillRect(cx - 20, cy - 24, 40, 30);
      ctx.strokeRect(cx - 20, cy - 24, 40, 30);
      ctx.strokeRect(-18 + cx, cy - 32, 6, 8);
      ctx.strokeRect(12 + cx, cy - 32, 6, 8);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(cx - 14, cy - 16, 8, 6);
      ctx.fillRect(cx + 6, cy - 16, 8, 6);
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(cx - 15, cy + 24); ctx.lineTo(cx + 10, cy + 12);
      ctx.stroke();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(cx + 20, cy + 8, 4, 0, Math.PI * 2);
      ctx.fill();
    }


    /* ----------------------------------------------------
       5. MAIN ARCADE LOOP
       ---------------------------------------------------- */
    function arcadeLoop() {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.strokeStyle = "#141414";
      ctx.lineWidth = 1;
      for (let x = 0; x < WIDTH; x += 30) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, HEIGHT); ctx.stroke();
      }
      for (let y = 0; y < HEIGHT; y += 30) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WIDTH, y); ctx.stroke();
      }

      if (activeGame === "MENU") {
        if (engineRunning) stopAircraftEngine();
        drawMenu();
      } else {
        if (activeGame !== "AIRCRAFT" && engineRunning) stopAircraftEngine();
        if (activeGame === "LOVERS") runLovers();
        if (activeGame === "AIRCRAFT") runAircraft();
        if (activeGame === "MONSTER") runMonster();

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1;
        ctx.strokeRect(WIDTH - 72, 6, 64, 22);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 11px monospace";
        ctx.textAlign = "center";
        ctx.fillText("◀ MENU", WIDTH - 40, 21);
      }

      // Sound Toggle Button (top-left in menu and in games)
      ctx.strokeStyle = sfxEnabled ? "#ffffff" : "#555555";
      ctx.lineWidth = 1;
      ctx.strokeRect(10, 6, 85, 22);
      ctx.fillStyle = sfxEnabled ? "#ffffff" : "#777777";
      ctx.font = "bold 10px monospace";
      ctx.textAlign = "center";
      ctx.fillText(sfxEnabled ? "🔊 SFX: ON" : "🔇 SFX: OFF", 52, 20);

      requestAnimationFrame(arcadeLoop);
    }
    arcadeLoop();
  </script>
